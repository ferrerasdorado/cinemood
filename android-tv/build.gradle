plugins {
    id 'com.android.application' version '8.3.2'
}

def ksFile = file("firma/cinemood.keystore")
def claveFile = file("firma/clave.txt")
def tieneFirma = ksFile.exists() && claveFile.exists()
def passFirma = tieneFirma ? claveFile.getText("UTF-8").trim() : ""

android {
    namespace 'es.cinemood.tv'
    compileSdk 34

    defaultConfig {
        applicationId "es.cinemood.tv"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    signingConfigs {
        if (tieneFirma) {
            release {
                storeFile ksFile
                storePassword passFirma
                keyAlias "cinemood"
                keyPassword passFirma
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (tieneFirma) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
}
