// CineMood para Android TV: app nativa (Kotlin + Jetpack Compose para TV + Media3).
// Ya no carga la web en un navegador interno: cada pantalla se dibuja de forma nativa,
// y solo pide a internet los datos (catálogo de TMDB, tu cuenta de Supabase y tus addons).
plugins {
    id 'com.android.application' version '8.3.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

def ksFile = file("firma/cinemood.keystore")
def claveFile = file("firma/clave.txt")
def tieneFirma = ksFile.exists() && claveFile.exists()
def passFirma = tieneFirma ? claveFile.getText("UTF-8").trim() : ""

android {
    namespace 'es.cinemood.tv'
    compileSdk 34

    defaultConfig {
        applicationId "es.cinemood.tv"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "3.0"
        // Solo los procesadores de las teles (ARM): el APK pesa menos
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            kotlin.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            baselineProfiles.srcDirs = ['perfil']
        }
    }

    signingConfigs {
        if (tieneFirma) {
            release {
                storeFile ksFile
                storePassword passFirma
                keyAlias "cinemood"
                keyPassword passFirma
            }
        }
    }

    buildTypes {
        release {
            // R8 quita el código que no se usa y optimiza el resto: la app arranca y se mueve más rápido
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (tieneFirma) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig false
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true   // lo pide el decodificador FFmpeg
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'DebugProbesKt.bin', 'kotlin-tooling-metadata.json']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    def bom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation bom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.tv:tv-material:1.0.0'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // Instala el perfil de arranque al abrir la app por primera vez (también si se instala a mano con el APK)
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'

    // Reproductor nativo (Media3)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    // Decodificador de audio FFmpeg (MP3, AC-3, E-AC-3, DTS, TrueHD, FLAC…) para cuando el de la tele falla.
    // Es la versión ya compilada que publica el proyecto Jellyfin; su versión tiene que coincidir con la de Media3.
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2'
}
